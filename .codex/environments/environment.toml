version = 1
name = "Python 3.12 · AGV 独立工作树"

[setup]
script = '''
set -eu
cd "$(git rev-parse --show-toplevel)"
if [ "$(uname -s)" = "Darwin" ]; then
  export PATH="/opt/homebrew/opt/python@3.12/libexec/bin:/opt/homebrew/bin:$HOME/.local/bin:$PATH"
fi
unset VIRTUAL_ENV PYTHONHOME PYTHONPATH
export UV_PROJECT_ENVIRONMENT="$PWD/.venv"
uv sync --python 3.12 --all-extras --inexact
export VIRTUAL_ENV="$PWD/.venv"
export PATH="$VIRTUAL_ENV/bin:$PATH"
python - <<'PY'
import importlib.metadata
import pathlib
import sys
import agv

root = pathlib.Path.cwd().resolve()
assert pathlib.Path(sys.prefix).resolve() == root / ".venv", sys.prefix
assert pathlib.Path(agv.__file__).resolve().is_relative_to(root / "src"), agv.__file__
print("Python:", sys.version.split()[0])
print("Interpreter:", sys.executable)
print("Project:", agv.__file__)
print("Package:", importlib.metadata.version("agv-warehouse-scheduling"))
PY
python -m agv --help >/dev/null
'''

[[actions]]
name = "检查当前环境"
icon = "debug"
command = '''
.venv/bin/python -c 'import sys, agv; from importlib.metadata import version; print(sys.executable); print(agv.__file__); print(version("agv-warehouse-scheduling"))'
.venv/bin/python -m agv --help
'''

[[actions]]
name = "运行单元测试"
icon = "test"
command = ".venv/bin/python -m unittest discover -s tests -t . -v"

[[actions]]
name = "检查代码格式"
icon = "tool"
command = ".venv/bin/ruff check src tests scripts && .venv/bin/ruff format --check src tests scripts"
