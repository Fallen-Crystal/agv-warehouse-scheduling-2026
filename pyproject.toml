[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agv-warehouse-scheduling"
version = "0.5.0"
description = "Reproducible warehouse simulation with safe interval and joint route planning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "build>=1.2,<2"]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
agv = "agv.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agv"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E741"]
