name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -t . -v
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: |
          python -m venv /tmp/agv-wheel
          /tmp/agv-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/agv-wheel/bin/agv run --tasks 2 --algorithm sipp_learned --output smoke.json
          /tmp/agv-wheel/bin/agv run --profile v4 --tasks 2 --vehicles 10 --algorithm sipp_budget --output v4-smoke.json
          /tmp/agv-wheel/bin/agv run --profile v4 --tasks 8 --vehicles 2 --algorithm bcrd_budget --output bcrd-smoke.json
          /tmp/agv-wheel/bin/agv run --profile v9 --tasks 2 --vehicles 1 --algorithm sipp_standby16_dispatch --output v9-smoke.json
          /tmp/agv-wheel/bin/python -c "from agv.web.app import create_server; s=create_server(); s.server_close()"
