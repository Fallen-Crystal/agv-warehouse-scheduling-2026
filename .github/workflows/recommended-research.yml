name: recommended-research-materials
on:
  push:
    paths: ['research/recommended-20261024/**', '.github/workflows/recommended-research.yml']
  pull_request:
    paths: ['research/recommended-20261024/**', '.github/workflows/recommended-research.yml']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python research/recommended-20261024/verification/verify.py
      - run: python -m pip install -e .
      - run: python research/recommended-20261024/current/run.py --case wepa-day45-bin4335 --seed 0 --output /tmp/recommended-smoke.json
      - run: python -c "import json; from agv.data.wepa import verify_input_selection; from agv.experiments.wepa import reference_protocol, RESOURCE; print(verify_input_selection('research/recommended-20261024/data/raw', reference_protocol(), json.loads(RESOURCE.joinpath('input-selection.json').read_text(encoding='utf-8'))))"
